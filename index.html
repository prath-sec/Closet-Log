<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Closet Log">
<meta name="theme-color" content="#F2F3F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11131A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}html,body{overscroll-behavior-y:none}</style>
<title>Closet Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: photo-first phone app with a bottom tab bar (Closet / Outfits / Wishlist / Stats). Grids of 4:5 photo tiles; sheets slide up for add/edit; full-screen viewer per item. */
:root{
  --bg:#F2F3F6; --surface:#FFFFFF; --ink:#181C28; --muted:#646B7D; --line:#DDE0E8;
  --denim:#2E4C86; --denim-soft:#E3E9F5; --tag:#B8894A; --tag-soft:#F4EADB;
  --good:#2E7D5B; --warn:#B7791F; --bad:#B4413C; --wash:#2B8A9E; --ph:#E6E8EE;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11131A; --surface:#1A1D27; --ink:#ECEEF4; --muted:#9AA1B3; --line:#2A2E3B;
  --denim:#86A3DB; --denim-soft:#222C42; --tag:#D9AE72; --tag-soft:#33291B;
  --good:#5CC195; --warn:#E0A84A; --bad:#E07A74; --wash:#5BC0D4; --ph:#232734; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11131A; --surface:#1A1D27; --ink:#ECEEF4; --muted:#9AA1B3; --line:#2A2E3B;
  --denim:#86A3DB; --denim-soft:#222C42; --tag:#D9AE72; --tag-soft:#33291B;
  --good:#5CC195; --warn:#E0A84A; --bad:#E07A74; --wash:#5BC0D4; --ph:#232734; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.app{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:18px 170px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label.pick:focus-within{outline:2px solid var(--denim);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:2rem;font-weight:800} h2{font-size:1.45rem;font-weight:700} h3{font-size:1.1rem;font-weight:700}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.total{font-family:var(--f-display);font-weight:800;font-size:2rem;color:var(--denim);line-height:1;text-align:right}
.total small{display:block;font-family:var(--f-body);font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;margin-bottom:10px}
.filters{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters select{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 10px;font:inherit;font-size:.82rem}
.filters select.on{border-color:var(--denim);color:var(--denim);font-weight:600}
.note{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--tag-soft);border:1px dashed var(--tag);border-radius:12px;padding:10px 12px;font-size:.85rem;margin-bottom:12px;width:100%;text-align:left}
.note b.go{border:0;background:var(--tag);color:var(--surface);border-radius:8px;padding:6px 10px;font-weight:600;white-space:nowrap}
.note.washn{background:color-mix(in srgb,var(--wash) 12%,var(--surface));border-color:var(--wash)}
.note.washn b.go{background:var(--wash)}
.note.inbox{background:var(--denim-soft);border-color:var(--denim)}
.note.inbox b.go{background:var(--denim)}
/* sections */
.secs{display:flex;flex-direction:column;gap:10px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:10px;width:100%}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-name{font-family:var(--f-display);font-weight:700;font-size:1.15rem}
.sec-count{font-family:var(--f-mono);font-size:1rem;color:var(--denim)}
.sec-subs{font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.th{aspect-ratio:1;border-radius:9px;overflow:hidden;background:var(--ph);max-width:100%}
.th.more{display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.strip-empty{font-size:.8rem;color:var(--muted);border:1px dashed var(--line);border-radius:9px;padding:14px;text-align:center}
/* tiles */
.ph{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.fake{width:100%;height:100%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.4rem;color:rgba(255,255,255,.88);text-shadow:0 1px 3px rgba(0,0,0,.3)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
@media (min-width:520px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{border:0;padding:0;background:transparent;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.tile .img{aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:var(--ph);position:relative;max-width:100%;border:1px solid var(--line)}
.tile.washing .img img,.tile.washing .img .fake{opacity:.45}
.badge{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap;right:8px}
.tile .size{position:absolute;right:8px;bottom:8px}
.tile .wc{position:absolute;left:8px;bottom:8px}
.tname{font-weight:600;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmeta{font-size:.75rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:-4px}
.size,.wc{font-family:var(--f-mono);font-size:.72rem;background:var(--surface);color:var(--ink);border-radius:6px;padding:2px 7px}
.pill{font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:5px;background:var(--surface)}
.pill.Worn{color:var(--warn)} .pill.Retire{color:var(--bad)} .pill.New{color:var(--good)} .pill.fav{color:var(--tag)} .pill.wash{color:var(--wash)}
.back{border:0;background:none;color:var(--denim);font-weight:600;padding:4px 0;margin-bottom:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 8px;scrollbar-width:none;margin-inline:-16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.85rem;font-weight:500;display:flex;gap:6px;align-items:center}
.chip .c{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--denim);border-color:var(--denim);color:var(--surface)}
.chip[aria-pressed="true"] .c{color:inherit;opacity:.8}
.chip.add{border-style:dashed;color:var(--muted)}
.group{margin-top:18px}
.empty{text-align:center;color:var(--muted);padding:36px 12px;border:1px dashed var(--line);border-radius:14px;margin-top:12px}
.foot{margin-top:28px;display:flex;gap:8px;flex-wrap:wrap}
.ghost{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;font-size:.85rem;color:var(--muted)}
/* tab bar + fab */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{display:flex;width:100%;max-width:620px}
.tab{flex:1;border:0;background:none;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--denim)}
.fab{position:fixed;right:max(16px,calc(50% - 294px));bottom:calc(76px + env(safe-area-inset-bottom,0px));border:0;background:var(--denim);color:var(--surface);font-weight:700;border-radius:999px;padding:14px 22px;box-shadow:0 6px 20px rgba(20,30,60,.25);font-size:1rem;z-index:5}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.5);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:620px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto}
.sheet h2{margin-bottom:12px}
.pick{display:block;aspect-ratio:4/3;max-height:260px;width:100%;border:2px dashed var(--line);border-radius:16px;background:var(--bg);overflow:hidden;position:relative;cursor:pointer;margin-bottom:10px}
.pick input,.multi input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.pick .hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-weight:600;text-align:center;padding:12px}
.pick .hint b{font-family:var(--f-display);font-size:1.15rem;color:var(--denim)}
.pick img{width:100%;height:100%;object-fit:contain;background:var(--ph)}
.pick .redo{position:absolute;right:10px;bottom:10px;background:var(--surface);border-radius:8px;padding:5px 10px;font-size:.8rem;font-weight:600;pointer-events:none}
.multi{position:relative;display:block;text-align:center;font-size:.85rem;color:var(--denim);font-weight:600;padding:8px;margin-bottom:12px;border-radius:10px;cursor:pointer}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.f > label,.f > .lbl{font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.f input,.f select,.f textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.colors button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);padding:0}
.colors button[aria-pressed="true"]{outline:2px solid var(--denim);outline-offset:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);padding:9px 4px;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--denim);color:var(--surface);font-weight:600}
details{margin-bottom:12px} summary{cursor:pointer;color:var(--denim);font-weight:600;font-size:.9rem;padding:4px 0 10px}
.actions{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
.primary{flex:1;border:0;background:var(--denim);color:var(--surface);font-weight:700;border-radius:12px;padding:13px}
.primary:disabled{opacity:.5}
.danger{border:1px solid var(--bad);color:var(--bad);background:transparent;border-radius:12px;padding:13px 16px;font-weight:600}
.danger.armed{background:var(--bad);color:var(--surface)}
.second{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:600}
.second.on{border-color:var(--good);color:var(--good)}
.second.washon{border-color:var(--wash);color:var(--wash)}
.hintbox{font-size:.82rem;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px;margin:-4px 0 12px}
.hintbox .strip{margin-top:8px}
/* quick actions */
.qhead{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.qhead .th{width:52px;flex:none}
.qa{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:14px 4px;font-weight:600}
.qa.red{color:var(--bad)}
/* picker */
.pk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.pk button{border:2px solid transparent;padding:0;border-radius:10px;overflow:hidden;aspect-ratio:4/5;background:var(--ph);position:relative}
.pk button[aria-pressed="true"]{border-color:var(--denim)}
.pk button[aria-pressed="true"]::after{content:"✓";position:absolute;right:4px;top:4px;width:20px;height:20px;border-radius:50%;background:var(--denim);color:var(--surface);font-size:.75rem;display:grid;place-items:center;font-weight:700}
/* outfits */
.ofs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.of{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.col{display:grid;grid-template-columns:1fr 1fr;gap:4px;aspect-ratio:1;border-radius:10px;overflow:hidden;max-width:100%}
.col > div{background:var(--ph);overflow:hidden;min-height:0}
.of .tname{padding:0 4px} .of .tmeta{padding:0 4px 2px;margin-top:-6px}
/* viewer */
.viewer{position:fixed;inset:0;z-index:12;background:var(--bg);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.viewer .vimg{flex:1 1 auto;min-height:220px;max-height:58vh;border-radius:18px;overflow:hidden;background:var(--ph);display:flex;align-items:center;justify-content:center}
.viewer .vimg img{max-width:100%;max-height:100%;object-fit:contain}
.viewer .vimg .col{height:100%;aspect-ratio:auto;width:100%}
.vbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.vinfo{padding:14px 2px 6px}
.vmeta{color:var(--muted);font-size:.88rem;margin-top:2px}
.vnotes{font-size:.88rem;margin-top:6px}
.vbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.vbtns .second{flex:1;min-width:130px}
.link{color:var(--denim);font-weight:600;word-break:break-all}
/* stats */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--f-mono);font-size:1.35rem}
.stat span{font-size:.75rem;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.panel h3{margin-bottom:4px}
.panel p{margin:0 0 6px;font-size:.82rem;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:9px 0;text-align:left}
.row:first-of-type{border-top:0}
.row .th{width:40px;flex:none}
.row .ri{flex:1;min-width:0}
.row .ri div{font-weight:600;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ri small{color:var(--muted);font-size:.75rem}
.row b{font-family:var(--f-mono);font-size:.9rem}
.cbar{display:flex;align-items:center;gap:8px;font-size:.82rem;margin-top:6px}
.cbar .dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);flex:none}
.cbar .tr{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.cbar .tr i{display:block;height:100%;background:var(--denim);border-radius:4px}
.cbar .n{font-family:var(--f-mono);width:24px;text-align:right}
.cbar .lb{width:56px}
.sz{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.sz div{background:var(--bg);border-radius:10px;padding:8px 10px;min-width:0}
.sz span{display:block;font-size:.72rem;color:var(--muted)}
.sz b{font-family:var(--f-mono);font-size:1.05rem;overflow-wrap:anywhere}
.brow{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:8px 0}
.brow > div{flex:1;min-width:0}
.brow small{display:block;color:var(--muted);font-size:.75rem}
.brow .size{background:var(--tag-soft);color:var(--tag)}
.brow .ghost{padding:5px 10px}
.bedit{display:grid;grid-template-columns:1.2fr 1fr .8fr;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.bedit input,.bedit select{width:100%;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit;font-size:.88rem}
.bedit .wide{grid-column:1/3}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:.85rem;z-index:20;max-width:calc(100% - 32px);text-align:center}
.tip{font-size:.78rem;color:var(--muted);text-align:center;margin-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app" id="app"></div>
<button class="fab" id="fab">＋ Add photo</button>
<nav class="tabbar" aria-label="Sections"><div class="in">
 <button class="tab" data-tab="closet"><svg viewBox="0 0 24 24"><path d="M12 4a2 2 0 0 1 2 2c0 1-1 1.5-2 2.2L3 14.5c-.8.6-.4 1.5.5 1.5h17c.9 0 1.3-.9.5-1.5L12 8.2"/></svg>Closet</button>
 <button class="tab" data-tab="outfits"><svg viewBox="0 0 24 24"><path d="M8 3 4 5.5 5.5 9 7 8.3V20h10V8.3l1.5.7L20 5.5 16 3c-.5 1.4-2 2.3-4 2.3S8.5 4.4 8 3Z"/></svg>Outfits</button>
 <button class="tab" data-tab="wish"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg>Wishlist</button>
 <button class="tab" data-tab="stats"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Stats</button>
</div></nav>
<div id="layer"></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ================= data ================= */
const COLORS={Black:"#1c1c1e",White:"#f7f7f5",Grey:"#8e8e93",Navy:"#1f2f55",Blue:"#3a6fc4",Denim:"#4a6891",Olive:"#6b6b3a",Green:"#2f7d4f",Beige:"#d8c7a6",Brown:"#7a5236",Red:"#b8322e",Maroon:"#6e1f2b",Pink:"#e3a1b5",Yellow:"#e8c33a",Orange:"#e07b32",Purple:"#6a4a9c",Multi:"multi"};
const MULTI="conic-gradient(#d44 0 25%,#e8b33a 0 50%,#3a8f5a 0 75%,#3a6fc4 0)";
const colBg=c=>c==="Multi"?MULTI:(COLORS[c]||"var(--ph)");
const DEFAULT_SECTIONS=[
 {id:"tops",name:"Tops",subs:["T-shirts","Shirts","Polos","Hoodies","Sweaters"]},
 {id:"bottoms",name:"Bottoms",subs:["Jeans","Joggers","Chinos","Trousers","Shorts"]},
 {id:"outer",name:"Outerwear",subs:["Jackets","Coats","Rain jackets"]},
 {id:"shoes",name:"Shoes",subs:["Sneakers","Running","Formal","Boots","Slides"]},
 {id:"gym",name:"Gym wear",subs:["Gym tees","Shorts","Tank tops","Track pants"]},
 {id:"acc",name:"Accessories",subs:["Caps","Belts","Bags","Watches","Scarves"]},
 {id:"basics",name:"Basics",subs:["Socks","Underwear","Sleepwear"]}
];
const INBOX={id:"inbox",name:"Unsorted",subs:[]};
const GEN_SIZES=[["tops","Tops","M"],["shirts","Shirts (collar)","40 / 15.75\""],["waist","Jeans waist / length","32/32"],["bottoms","Joggers / shorts","M"],["outer","Jackets","L"],["shoes","Shoes (EU)","43"],["gym","Gym wear","M"],["other","Other notes","Ring 60, belt 90"]];
const CONDS=["New","Good","Worn","Retire"], SEASONS=["All-year","Summer","Winter"];
const KEY="closet-log-v1", FKEY="closet-log-filters";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toLocaleDateString("sv");

function migrate(d){
 d.sections=d.sections||structuredClone(DEFAULT_SECTIONS);
 d.items=(d.items||[]).map(i=>Object.assign(blank(),{id:i.id,added:i.added||today()},i,{wears:i.wears||[]}));
 d.outfits=d.outfits||[]; d.wishlist=d.wishlist||[];
 d.sizes=d.sizes||{general:{},brands:[]}; d.sizes.general=Object.assign(Object.fromEntries(GEN_SIZES.map(g=>[g[0],""])),d.sizes.general||{}); d.sizes.brands=d.sizes.brands||[];
 d.v=3; return d;
}

/* storage: list in localStorage, photos in IndexedDB */
let S, db=null; const urls={};
function load(){try{const r=localStorage.getItem(KEY);if(r){S=migrate(JSON.parse(r));return}}catch(e){} S=migrate({sections:structuredClone(DEFAULT_SECTIONS),items:[],outfits:[],wishlist:[]})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Could not save on this device")}}
function openDB(){return new Promise(res=>{try{const r=indexedDB.open("closet-photos",1);r.onupgradeneeded=()=>r.result.createObjectStore("p");r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})}
function idb(mode,fn){return new Promise((res,rej)=>{if(!db)return rej(new Error("no db"));try{const t=db.transaction("p",mode);const out=fn(t.objectStore("p"));t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error)}catch(e){rej(e)}})}
const putPhoto=(id,b)=>idb("readwrite",s=>s.put(b,id));
function delPhoto(id){idb("readwrite",s=>s.delete(id)).catch(()=>{});if(urls[id]){URL.revokeObjectURL(urls[id]);delete urls[id]}}
function getAllPhotos(){return new Promise(res=>{if(!db)return res();try{const r=db.transaction("p").objectStore("p").openCursor();r.onsuccess=()=>{const c=r.result;if(c){urls[c.key]=URL.createObjectURL(c.value);c.continue()}else res()};r.onerror=()=>res()}catch(e){res()}})}
function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const M=1000;let w=im.naturalWidth,h=im.naturalHeight;const k=Math.min(1,M/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),"image/jpeg",.82)};im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}

function pic(it){

 return `<div class="fake" style="background:${(it&&it.hue)||(it&&it.color&&colBg(it.color))||"var(--muted)"}">${esc(((it&&(it.sub||it.name))||"?")[0])}</div>`;
}
function filtered(list){
 let r=list.filter(i=>(!F.color||i.color===F.color)&&(!F.season||i.season===F.season||i.season==="All-year")&&(F.wash!=="avail"||!i.inWash)&&(F.wash!=="wash"||i.inWash));
 const by={new:(a,b)=>(b.added||"").localeCompare(a.added||""),fav:(a,b)=>(b.fav-a.fav),most:(a,b)=>b.wears.length-a.wears.length,least:(a,b)=>a.wears.length-b.wears.length,name:(a,b)=>(a.name||a.sub).localeCompare(b.name||b.sub)}[F.sort];
 return by?r.slice().sort(by):r;

 </div>`;

 if(q){
  const r=filtered(S.items).filter(i=>[i.name,i.brand,i.sub,i.notes,i.color,i.season,secOf(i.cat).name].join(" ").toLowerCase().includes(q));

 }).join("")+`</div>`;

/* ================= size profile ================= */
const brandKey=(b,c)=>(b||"").trim().toLowerCase()+"|"+c;
function closetSizes(){
 const m={};S.items.forEach(i=>{if(!i.brand||!i.size||i.cat==="inbox")return;const k=brandKey(i.brand,i.cat);(m[k]=m[k]||{brand:i.brand.trim(),cat:i.cat,sizes:{}}).sizes[i.size]=(m[k].sizes[i.size]||0)+1});
 const saved=new Set(S.sizes.brands.map(b=>brandKey(b.brand,b.cat)));
 return Object.values(m).filter(x=>!saved.has(brandKey(x.brand,x.cat))).map(x=>({...x,top:Object.entries(x.sizes).sort((a,b)=>b[1]-a[1])[0][0]}));
}
function usualSize(brand,cat){
 const b=S.sizes.brands.find(x=>brandKey(x.brand,x.cat)===brandKey(brand,cat));if(b)return [b.size,`your usual ${b.brand} size`];
 const g={tops:"tops",bottoms:"waist",outer:"outer",shoes:"shoes",gym:"gym"}[cat];
 if(g&&S.sizes.general[g])return [S.sizes.general[g],"your usual size"];return null;
}
function sizePanel(){
 const g=S.sizes.general, filled=GEN_SIZES.filter(([k])=>g[k]);
 const sugg=closetSizes();
 let h=`<div class="panel" id="sizes"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3>My sizes</h3><button class="second" id="editSizes" style="padding:7px 14px">Edit</button></div>

/* ================= overlays ================= */
function close(){$("#layer").innerHTML=""}
function openSheet(html,bind){$("#layer").innerHTML=`<div class="scrim" id="scrim"></div><div class="sheet" role="dialog" aria-modal="true">${html}</div>`;$("#scrim").onclick=close;bind&&bind()}
function twoTap(btn,label,fn){btn.onclick=()=>{if(!btn.classList.contains("armed")){btn.classList.add("armed");btn.dataset.t=btn.textContent;btn.textContent=label;setTimeout(()=>{if(btn.isConnected){btn.classList.remove("armed");btn.textContent=btn.dataset.t}},3500);return}fn()}}

function toggleWore(it){const t=today();if(it.wears.includes(t)){it.wears=it.wears.filter(d=>d!==t);toast("Removed today's wear")}else{it.wears.push(t);toast(`Logged · worn ${it.wears.length}×`)}save()}

function colourPicker(cur){return `<div class="colors">${Object.keys(COLORS).map(n=>`<button type="button" data-col="${n}" aria-label="${n}" aria-pressed="${n===cur}" style="background:${colBg(n)}"></button>`).join("")}</div>`}
function bindColours(set){$$("[data-col]").forEach(b=>b.onclick=()=>{const was=b.getAttribute("aria-pressed")==="true";$$("[data-col]").forEach(x=>x.setAttribute("aria-pressed","false"));if(!was)b.setAttribute("aria-pressed","true");set(was?"":b.dataset.col)})}

function itemSheet(orig){

 if(it.cat==="inbox"){it.cat=S.sections[0].id;it.sub=S.sections[0].subs[0]||""}
 let newBlob=null,preview=urls[it.id]||null;
 const subOpts=()=>{const a=[...secOf(it.cat).subs];if(it.sub&&!a.includes(it.sub))a.push(it.sub);return a.map(x=>`<option ${x===it.sub?"selected":""}>${esc(x)}</option>`).join("")};

  <div class="row2"><div class="f"><label for="fName">Name</label><input id="fName" placeholder="Black slim jeans" value="${esc(it.name)}"></div>
  <div class="f"><label for="fSize">Size</label><input id="fSize" placeholder="M · 32/32 · 43" value="${esc(it.size)}"></div></div>
  <div class="hintbox" id="usual" hidden></div>

   <div class="f"><span class="lbl">Condition</span><div class="seg">${CONDS.map(c=>`<button type="button" data-cond data-v="${c}" aria-pressed="${c===it.cond}">${c}</button>`).join("")}</div></div>

 });

function removeItem(id){S.items=S.items.filter(x=>x.id!==id);S.outfits.forEach(o=>o.items=o.items.filter(x=>x!==id));delPhoto(id);save();close();render();toast("Deleted")}
async function bulkAdd(files){
 close();if(!files.length)return;toast(`Adding ${files.length} photos…`);let n=0;
 for(const f of files){try{const b=await shrink(f);const it=blank({cat:"inbox",sub:"",photo:true});await putPhoto(it.id,b);urls[it.id]=URL.createObjectURL(b);S.items.unshift(it);n++}catch(e){}}
 save();view={tab:"closet",sec:"inbox",sub:"All",q:""};render();scrollTo(0,0);toast(`${n} photo${n===1?"":"s"} added. Tap each to sort it.`);
}

   if(newBlob){try{await putPhoto(w.id,newBlob);if(urls[w.id])URL.revokeObjectURL(urls[w.id]);urls[w.id]=preview;w.photo=true;delete w.hue}catch(e){}}
   const i=S.wishlist.findIndex(x=>x.id===w.id);if(i>=0)S.wishlist[i]=w;else S.wishlist.unshift(w);save();close();render();toast("Saved")};
  const d=$("#wDel");if(d)twoTap(d,"Tap again to delete",()=>{S.wishlist=S.wishlist.filter(x=>x.id!==w.id);delPhoto(w.id);save();close();render();toast("Removed")});
 });
}
function wishViewer(w){
 const own=S.items.filter(i=>i.cat===w.cat&&i.sub===w.sub);
 const safe=/^https?:\/\//i.test(w.link)?w.link:"";
 $("#layer").innerHTML=`<div class="viewer" role="dialog" aria-modal="true">
  <div class="vbar"><button class="back" id="vclose">‹ Back</button><button class="second" id="vedit" style="padding:8px 16px">Edit</button></div>
  <div class="vimg" style="max-height:44vh">${urls[w.id]?`<img src="${urls[w.id]}" alt="">`:`<div class="fake" style="background:${w.hue||"var(--muted)"};font-size:4rem">${esc((w.sub||"?")[0])}</div>`}</div>
  <div class="vinfo"><h2>${esc(w.name)}</h2><div class="vmeta">${esc([secOf(w.cat).name,w.sub,w.price?euro(+w.price):""].filter(Boolean).join(" · "))}</div>
  ${safe?`<div class="vnotes"><a class="link" href="${esc(safe)}" target="_blank" rel="noopener">${esc(safe)}</a></div>`:""}${w.notes?`<div class="vnotes">${esc(w.notes)}</div>`:""}
  <div class="vbtns"><button class="second on" id="bought">I bought it · move to closet</button></div></div>
  <div class="eyebrow" style="margin-top:6px">${own.length?`Already in your closet · ${own.length} ${esc(w.sub.toLowerCase())}`:`No ${esc(w.sub.toLowerCase())} in your closet yet`}</div>
  ${own.length?`<div class="tiles">${own.map(tile).join("")}</div>`:""}</div>`;
 $("#vclose").onclick=close;$("#vedit").onclick=()=>wishSheet(w);
 $$(".viewer [data-view]").forEach(b=>b.onclick=()=>itemViewer(itemById(b.dataset.view)));
 $("#bought").onclick=()=>{const it=blank({id:w.id,cat:w.cat,sub:w.sub,name:w.name,notes:w.notes,price:w.price,cond:"New",photo:w.photo,hue:w.hue});
  S.wishlist=S.wishlist.filter(x=>x.id!==w.id);S.items.unshift(it);save();view={tab:"closet",sec:w.cat,sub:"All",q:""};render();toast("Moved to your closet. Add size and colour.");itemSheet(it)};
}

/* backup */
async function exportBackup(){
 toast("Preparing backup…");
 const photos={};
 for(const id of Object.keys(urls)){try{const b=await (await fetch(urls[id])).blob();photos[id]=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)})}catch(e){}}
 const blob=new Blob([JSON.stringify({app:"closet-log",v:3,saved:new Date().toISOString(),data:S,photos})],{type:"application/json"});
 const name=`closet-backup-${today()}.json`;
 try{const file=new File([blob],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Closet Log backup"});toast("Backup ready");return}}catch(e){if(e&&e.name==="AbortError")return}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
 toast("Backup saved");
}
function restoreSheet(file){
 const fr=new FileReader();
 fr.onload=()=>{let d;try{d=JSON.parse(fr.result);if(d.app!=="closet-log"||!d.data||!Array.isArray(d.data.items))throw 0}catch(e){toast("That file isn't a Closet Log backup");return}
  const n=Object.keys(d.photos||{}).length;
  openSheet(`<h2>Restore backup?</h2><p style="color:var(--muted)">From ${esc((d.saved||"").slice(0,10))}: <b style="color:var(--ink)">${d.data.items.length}</b> items, ${n} photos, ${(d.data.outfits||[]).length} outfits. This replaces everything currently in the app.</p>
   <div class="actions"><button class="second" id="rNo" style="flex:1">Cancel</button><button class="danger" id="rYes" style="flex:1">Replace my closet</button></div>`,()=>{
   $("#rNo").onclick=close;
   twoTap($("#rYes"),"Tap again to replace",async()=>{
    $("#rYes").disabled=true;
    try{await idb("readwrite",s=>s.clear())}catch(e){}
    Object.keys(urls).forEach(k=>{URL.revokeObjectURL(urls[k]);delete urls[k]});
    for(const [id,du] of Object.entries(d.photos||{})){try{const b=await (await fetch(du)).blob();await putPhoto(id,b);urls[id]=URL.createObjectURL(b)}catch(e){}}
    S=migrate(d.data);save();close();view={tab:"closet",sec:null,sub:"All",q:""};render();toast(`Restored ${S.items.length} items`);
   });
  });
 };
 fr.readAsText(file);
}

/* ================= events ================= */
let lp=null,lpFired=false,lpX=0,lpY=0;
document.addEventListener("pointerdown",e=>{const t=e.target.closest(".app [data-view]");if(!t)return;lpFired=false;lpX=e.clientX;lpY=e.clientY;clearTimeout(lp);lp=setTimeout(()=>{lpFired=true;const it=itemById(t.dataset.view);if(it){navigator.vibrate?.(10);quickActions(it)}},480)});
document.addEventListener("pointermove",e=>{if(lp&&Math.hypot(e.clientX-lpX,e.clientY-lpY)>10){clearTimeout(lp);lp=null}});
["pointerup","pointercancel"].forEach(ev=>document.addEventListener(ev,()=>{clearTimeout(lp);lp=null}));
document.addEventListener("contextmenu",e=>{if(e.target.closest(".app [data-view]"))e.preventDefault()});

document.addEventListener("change",e=>{
 const id=e.target.id,m={fColor:"color",fSeason:"season",fSort:"sort",fWash:"wash"}[id];
 if(m&&e.target.closest(".app")){F[m]=e.target.value;saveF();render()}
});
document.addEventListener("click",e=>{
 if(lpFired){lpFired=false;e.preventDefault();return}
 const t=e.target.closest("button,[role=button]");if(!t||t.closest(".sheet,.viewer"))return;
 if(t.dataset.tab){view={tab:t.dataset.tab,sec:null,sub:"All",q:""};close();render();scrollTo(0,0)}
 else if(t.dataset.sec){view={tab:"closet",sec:t.dataset.sec,sub:"All",q:""};render();scrollTo(0,0)}
 else if(t.dataset.sub){view.sub=t.dataset.sub;render()}
 else if(t.dataset.view){itemViewer(itemById(t.dataset.view))}
 else if(t.dataset.outfit){outfitViewer(S.outfits.find(o=>o.id===t.dataset.outfit))}
 else if(t.dataset.wish){wishViewer(S.wishlist.find(w=>w.id===t.dataset.wish))}
 else if(t.id==="home"){view={tab:"closet",sec:null,sub:"All",q:""};render()}
 else if(t.id==="fab"){view.tab==="outfits"?outfitSheet():view.tab==="wish"?wishSheet():itemSheet()}
 else if(t.id==="clearEx"){S.items=S.items.filter(i=>!i.example);const ids=new Set(S.items.map(i=>i.id));S.outfits=S.outfits.filter(o=>!o.example).map(o=>({...o,items:o.items.filter(x=>ids.has(x))}));S.wishlist=S.wishlist.filter(w=>!w.example);S.sizes.brands=S.sizes.brands.filter(b=>!b.example);save();render();toast("Examples cleared")}
 else if(t.id==="allClean"){S.items.forEach(i=>i.inWash=false);save();render();toast("Everything's back in the closet")}
 else if(t.id==="addSub"){const s=secOf(view.sec);nameSheet("New type in "+s.name,"Type name (e.g. Cargo pants)",v=>{if(!s.subs.includes(v))s.subs.push(v);view.sub=v})}
 else if(t.id==="rmSub"){const s=secOf(view.sec);s.subs=s.subs.filter(x=>x!==view.sub);view.sub="All";save();render();toast("Type removed")}
 else if(t.id==="addSec"){nameSheet("New section","Section name (e.g. Traditional)",v=>S.sections.push({id:uid(),name:v,subs:[]}))}
 else if(t.id==="exp"){exportBackup()}
 else if(t.id==="editSizes"){sizeSheet()}
 else if(t.dataset.savesize){const [brand,cat,size]=t.dataset.savesize.split("|");S.sizes.brands.push({id:uid(),brand,cat,size,note:""});save();render();toast(`Saved ${brand} ${size}`)}
});
function nameSheet(title,label,cb){
 openSheet(`<h2>${title}</h2><div class="f"><label for="nm">${label}</label><input id="nm"></div><div class="actions"><button class="primary" id="ok">Add</button></div>`,()=>{
  $("#nm").focus();const go=()=>{const v=$("#nm").value.trim();if(v){cb(v);save();close();render()}};$("#ok").onclick=go;$("#nm").onkeydown=e=>{if(e.key==="Enter")go()}});
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
load();render();openDB().then(getAllPhotos).then(render);
</script>
